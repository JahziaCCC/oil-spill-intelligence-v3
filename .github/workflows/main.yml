name: Oil Spill Intelligence V3

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"


jobs:

  run-system:

    runs-on: ubuntu-latest


    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      - name: Install dependencies
        run: |
          pip install -r requirements.txt


      - name: Run System
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
        run: |
          python main.py
